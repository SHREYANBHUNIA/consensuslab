syntax = "proto3";
package consensuslab.v1;
option go_package = "consensuslab/core/api";

service RaftTransport { rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse); rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse); rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse); }
message RequestVoteRequest { string candidate_id = 1; int64 term = 2; int64 last_log_index = 3; int64 last_log_term = 4; }
message RequestVoteResponse { bool granted = 1; int64 term = 2; }
message LogEntry { int64 index = 1; int64 term = 2; string command = 3; }
message AppendEntriesRequest { string leader_id = 1; int64 term = 2; int64 previous_log_index = 3; int64 previous_log_term = 4; repeated LogEntry entries = 5; int64 leader_commit = 6; }
message AppendEntriesResponse { bool accepted = 1; int64 term = 2; int64 match_index = 3; }
message HeartbeatRequest { string leader_id = 1; int64 term = 2; int64 commit_index = 3; }
message HeartbeatResponse { bool accepted = 1; int64 term = 2; }
